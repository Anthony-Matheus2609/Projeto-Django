{% for item in equipamentos %}
<tr>
    <td><strong>#{{ item.id }}</strong></td>

    <td>{{ item.nome }}</td>

    <td>{{ item.numero_patrimonio }}</td>

    <td>{{ item.tipo }}</td>

    <td>
        {% if item.em_uso %}
            <span class="badge bg-danger">Em uso</span>
        {% else %}
            <span class="badge bg-success">Disponível</span>
        {% endif %}
    </td>

    <td>
        <a href="/equipamento/{{ item.id }}/"
           class="btn btn-sm btn-outline-primary">
            Ver
        </a>

        <a href="/editar/{{ item.id }}/"
           class="btn btn-sm btn-outline-warning">
            Editar
        </a>

        <a href="/deletar/{{ item.id }}/"
           class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Tem certeza que deseja apagar o equipamento {{ item.nome }}?')">
            Apagar
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="text-center text-muted py-4">
        Nenhum equipamento cadastrado ainda.
    </td>
</tr>
{% endfor %}
