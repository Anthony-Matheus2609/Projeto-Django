{% extends "meu_app/base.html" %}

{% block meu_conteudo %}

<div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
    <div class="card-body">

        <h1 class="h4 mb-4">Cadastrar Novo Equipamento</h1>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">{{ form.nome.label }}</label>
                {{ form.nome }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    {{ form.numero_patrimonio.label }}
                </label>
                {{ form.numero_patrimonio }}
            </div>

            <div class="mb-3">
                <label class="form-label">{{ form.tipo.label }}</label>
                {{ form.tipo }}
            </div>

            <div class="form-check mb-3">
                {{ form.em_uso }}
                <label class="form-check-label">
                    {{ form.em_uso.label }}
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Salvar
            </button>

            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                Cancelar
            </a>

        </form>

    </div>
</div>

{% endblock %}
