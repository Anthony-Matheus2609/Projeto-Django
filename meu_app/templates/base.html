<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciando Equipamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> 

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            
            <a
                class="navbar-brand"
                href="{% url 'dashboard' %}">
                 Lista Equips.
           </a>
            
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            
            <div class="collapse navbar-collapse" id="menuPrincipal">
                
                <ul class="navbar-nav ms-auto">
                    
                   
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/dashboard/">Lista Equips.</a>
                    
                    <li class="nav-item">
                       <a
                         class="nav-link text-warning fw-bold"
                         href="{% url 'cadastrar_equipamento' %}">
                         + Novo Equipamento
                       </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="/admin/" target="_blank">Admin</a>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container">
        {% block meu_conteudo %}
        {% endblock %}
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
