<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciando Equipamentos</title>
    <!-- A MÁGICA COMEÇA AQUI: Puxando as "roupas prontas" do Bootstrap da internet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> <!-- bg-light: Uma "roupa" para deixar o fundo cinza claro -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <!-- Logo / Nome da Loja (Clica e vai pra vitrine) -->
            <a class="navbar-brand" href="/dashboard/">Lista Equips.</a>
            
            <!-- Botão que aparece só em telas pequenas (Celular) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Os Links do Menu -->
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <!-- A classe ms-auto empurra os itens para o lado direito -->
                <ul class="navbar-nav ms-auto">
                    
                    <!-- Visão do Cliente -->
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/dashboard/">Lista Equips.</a>
                    
                    <!-- Ações -->
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-bold" href="/cadastrar/">+ Novo Equipamento</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="/admin/" target="_blank">Admin</a>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>
    <!-- ========================================== -->

    <!-- Aqui é onde o conteúdo das outras páginas é injetado! -->
    <div class="container">
        {% block meu_conteudo %}
        {% endblock %}
    </div>

    <!-- O Script do Bootstrap (Obrigatório para o menu funcionar no celular) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
